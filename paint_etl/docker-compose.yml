# Local PostgreSQL for the BOM / paint-data project.
# Separate from any other Postgres you run: own container, own port (5433), own volume.
# Local development credentials only — not for any shared or production system.
services:
  bom-db:
    image: postgres:15-alpine
    container_name: bom-paint-postgres
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: bom
      POSTGRES_DB: bom_paint
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bom_paint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom -d bom_paint"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  bom_paint_pgdata:
